<style>
/* 深淵禁頁：紫紅色空間失真 */
#abyss-transition {
  position: fixed;
  inset: 0;
  z-index: 99999;
  pointer-events: none;
  opacity: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 50%,
      rgba(151, 32, 107, .25),
      transparent 55%),
    linear-gradient(135deg,
      rgba(12, 5, 24, .98),
      rgba(70, 9, 47, .94),
      rgba(22, 8, 42, .98));
}

#abyss-transition::before,
#abyss-transition::after {
  content: "";
  position: absolute;
  inset: -30%;
  opacity: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0 35px,
    rgba(244, 55, 119, .17) 36px 38px,
    transparent 39px 72px
  );
}

#abyss-transition.active {
  animation: abyss-flash 1.35s ease forwards;
}

#abyss-transition.active::before {
  animation: abyss-glitch .7s steps(2, end) both;
}

#abyss-transition.active::after {
  background: linear-gradient(
    115deg,
    transparent 35%,
    rgba(226, 45, 112, .45) 48%,
    rgba(110, 48, 255, .25) 52%,
    transparent 65%
  );
  animation: abyss-slice .9s ease-in-out both;
}

body.abyss-enter {
  animation: world-glitch .65s steps(2, end);
}

@keyframes abyss-flash {
  0% { opacity: 0; }
  12% { opacity: 1; }
  25% { opacity: .72; }
  38% { opacity: 1; }
  60% { opacity: .9; }
  100% { opacity: 0; }
}

@keyframes abyss-glitch {
  0% { opacity: 0; transform: translateX(-8%); }
  25% { opacity: .9; transform: translateX(5%) skewX(-8deg); }
  50% { opacity: .4; transform: translateX(-3%) skewX(12deg); }
  100% { opacity: 0; transform: translateX(0); }
}

@keyframes abyss-slice {
  0% { opacity: 0; transform: translateX(-35%) rotate(-8deg); }
  35% { opacity: 1; }
  100% { opacity: 0; transform: translateX(35%) rotate(8deg); }
}

@keyframes world-glitch {
  0%, 100% { transform: translateX(0); filter: none; }
  20% { transform: translateX(-4px); filter: hue-rotate(70deg); }
  40% { transform: translateX(4px); filter: hue-rotate(-55deg); }
  60% { transform: translateX(-2px); filter: contrast(1.4); }
  80% { transform: translateX(2px); filter: hue-rotate(35deg); }
}

@media (prefers-reduced-motion: reduce) {
  #abyss-transition,
  #abyss-transition::before,
  #abyss-transition::after,
  body.abyss-enter {
    animation-duration: .01ms !important;
  }
}
</style>

<div id="abyss-transition" aria-hidden="true"></div>

<script>
(() => {
  const layer = document.getElementById("abyss-transition");
  if (!layer) return;

  const reducedMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 只在點擊導覽列的「禁頁」時播放轉場
  document.querySelectorAll('a[href="secret.html"]')
    .forEach(link => {
      link.addEventListener("click", event => {
        const target = new URL(link.href, location.href);

        // 已經在禁頁時不重複播放
        if (target.pathname === location.pathname) return;

        event.preventDefault();

        if (reducedMotion) {
          location.href = target.href;
          return;
        }

        layer.classList.remove("active");
        document.body.classList.remove("abyss-enter");

        void layer.offsetWidth;

        layer.classList.add("active");
        document.body.classList.add("abyss-enter");

        setTimeout(() => {
          location.href = target.href;
        }, 950);
      });
    });
})();
</script>
